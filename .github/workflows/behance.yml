# Chaque lundi à 7 h (heure de Paris en hiver), récupère les derniers projets Behance
# de chaque freelance et met à jour behance.json + img/behance/.
# Lancement manuel possible : onglet « Actions » → « Aperçus Behance » → « Run workflow ».
name: Aperçus Behance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les derniers projets Behance
        shell: pwsh
        run: ./scripts/behance.ps1

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add behance.json img/behance
          if git diff --cached --quiet; then
            echo "Rien de nouveau sur Behance."
          else
            git commit -m "Behance : mise à jour des aperçus"
            git push
          fi
